
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>My Wallet</h1>
        <p>Keep track of your daily expenses</p>
    </header>

    <main class="container">

        <section class="summary">
            <div class="summary-box">
                <h3>Total Expenses</h3>
                <p id="total">₹0.00</p>
            </div>

            <div class="summary-box">
                <h3>Total Transactions</h3>
                <p id="count">0</p>
            </div>
        </section>

        <section class="card">
            <h2>Add an Expense</h2>

            <form id="expense-form">
                <label for="description">Expense Name</label>
                <input type="text" id="description"
                       placeholder="e.g. Lunch" maxlength="80" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount"
                       placeholder="Enter amount" min="0.01"
                       max="10000000" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="card">
            <div class="list-heading">
                <h2>My Transactions</h2>

                <select id="filter">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <p id="empty-message">No expenses added yet.</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-list"></tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>My Wallet | Simple Expense Tracker</p>
    </footer>

</body>
</html>
